name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: dotstrap-linux-x64
            target: x86_64-unknown-linux-gnu
            source: target/x86_64-unknown-linux-gnu/release/dotstrap
          - runner: windows-latest
            asset: dotstrap-windows-x64.exe
            target: x86_64-pc-windows-msvc
            source: target/x86_64-pc-windows-msvc/release/dotstrap.exe

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select stable Rust
        run: |
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Run tests
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release executable
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage Linux executable
        if: runner.os == 'Linux'
        run: cp "${{ matrix.source }}" "${{ matrix.asset }}"

      - name: Stage Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "${{ matrix.source }}" "${{ matrix.asset }}"

      - name: Upload executable
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download executables
        uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create release and upload executables
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" release/* --clobber
